; Per-directory PHP overrides (picked up by PHP-FPM without needing root access).
; Required for large file uploads/downloads on shared hosting with conservative php.ini defaults.
upload_max_filesize = 4096M
post_max_size = 4096M
max_execution_time = 1800
max_input_time = 1800
memory_limit = 512M
max_file_uploads = 20
